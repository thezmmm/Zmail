spring:
  application:
    name: zmail-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zmail}
    username: ${DB_USER:zmail}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GMAIL_CLIENT_ID:dev-gmail-client-id}
            client-secret: ${GMAIL_CLIENT_SECRET:dev-gmail-client-secret}
            redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/auth/gmail/callback}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
              - https://www.googleapis.com/auth/gmail.modify
          microsoft:
            client-id: ${MSGRAPH_CLIENT_ID:dev-msgraph-client-id}
            client-secret: ${MSGRAPH_CLIENT_SECRET:dev-msgraph-client-secret}
            redirect-uri: ${MSGRAPH_REDIRECT_URI:http://localhost:8080/api/v1/auth/msgraph/callback}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
              - offline_access
              - https://graph.microsoft.com/Mail.Read
              - https://graph.microsoft.com/Mail.Send
              - https://graph.microsoft.com/Mail.ReadWrite
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MSGRAPH_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MSGRAPH_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

# ── LangChain4j / OpenAI ────────────────────────────────────────────────────
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:dev-placeholder-set-real-key}
    log-requests: false
    log-responses: false

# ── App-specific ─────────────────────────────────────────────────────────────
zmail:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-32-chars-not-for-production!!}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  gmail:
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/auth/gmail/callback}

  msgraph:
    client-id: ${MSGRAPH_CLIENT_ID:dev-msgraph-client-id}
    client-secret: ${MSGRAPH_CLIENT_SECRET:dev-msgraph-client-secret}
    tenant-id: ${MSGRAPH_TENANT_ID:common}
    redirect-uri: ${MSGRAPH_REDIRECT_URI:http://localhost:8080/api/v1/auth/msgraph/callback}

  agent:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    main-model: gpt-4o
    summarize-model: gpt-4o
    classify-model: gpt-4o-mini
    compress-model: gpt-4o-mini
    max-emails-per-run: 50
    memory-window-size: 30
    memory-compress-batch-size: 20

  scheduler:
    email-sync-cron: "0 */5 * * * *"
    daily-summary-cron: "0 0 8 * * *"
    memory-consolidation-cron: "0 30 0 * * *"

  proxy:
    host: ${PROXY_HOST:}
    port: ${PROXY_PORT:0}

  vector-store:
    dimension: 1536
    collection-name: email_embeddings

  embedding:
    model-name: text-embedding-3-small

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api/v1

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized